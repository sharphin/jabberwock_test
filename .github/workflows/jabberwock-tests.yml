name: Jabberwock test suite
on:
  push:
    branches: [main]
    paths: ['.github/workflows/jabberwock-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extracted/jabberwock-safety-ci-resume
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rust unit and integration tests
        run: cargo test --all-targets --locked
      - name: Python regression tests
        if: success() || failure()
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Linux safety probes
        if: success() || failure()
        run: python3 scripts/safety_linux.py
      - name: Lean formal verification
        if: success() || failure()
        run: python3 scripts/formal_report.py --compiler all --output target/formal-report.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jabberwock-test-evidence
          path: |
            extracted/jabberwock-safety-ci-resume/target/*.json
            extracted/jabberwock-safety-ci-resume/target/**/*.json
          if-no-files-found: ignore
