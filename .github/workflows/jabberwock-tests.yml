name: Jabberwock test suite
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jabberwock-tests.yml'
      - 'extracted/jabberwock-safety-ci-resume/src/**'
      - 'extracted/jabberwock-safety-ci-resume/tests/**'
      - 'extracted/jabberwock-safety-ci-resume/scripts/**'
      - 'extracted/jabberwock-safety-ci-resume/formal/**'
      - 'extracted/jabberwock-safety-ci-resume/jwc/**'
      - 'extracted/jabberwock-safety-ci-resume/runtime/**'
      - 'extracted/jabberwock-safety-ci-resume/examples/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: extracted/jabberwock-safety-ci-resume
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extracted/jabberwock-safety-ci-resume
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rust compile (measured, bounded)
        timeout-minutes: 8
        run: |
          /usr/bin/time -v timeout 450s cargo test --all-targets --locked --no-run
      - name: Rust library and binaries
        if: success() || failure()
        timeout-minutes: 5
        run: |
          /usr/bin/time -v timeout 270s cargo test --lib --bins --locked -- --test-threads=4
      - name: Rust integration tests (full suite, preserve failure log)
        if: success() || failure()
        timeout-minutes: 20
        shell: bash
        run: |
          mkdir -p target/ci-integration
          set -o pipefail
          cargo test --locked --tests -- --test-threads=4 2>&1 | tee target/ci-integration/full-suite.log
      - name: Python regression tests
        if: success() || failure()
        timeout-minutes: 5
        run: timeout 240s python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install pinned Lean toolchain
        if: success() || failure()
        timeout-minutes: 8
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/jw-elan-init.sh
          sh /tmp/jw-elan-init.sh -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" env lean --version
        working-directory: extracted/jabberwock-safety-ci-resume/formal
      - name: Lean kernel theorem tests (not whole-compiler proof)
        if: success() || failure()
        timeout-minutes: 35
        run: timeout 2040s python3 scripts/formal_report.py --compiler all --kernel-only --output target/formal-report.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jabberwock-test-evidence
          path: |
            extracted/jabberwock-safety-ci-resume/target/*.json
            extracted/jabberwock-safety-ci-resume/target/**/*.json
            extracted/jabberwock-safety-ci-resume/target/ci-integration/*
          if-no-files-found: ignore

  linux-safety:
    name: Linux safety (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [jwc, rust]
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: extracted/jabberwock-safety-ci-resume
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extracted/jabberwock-safety-ci-resume
          key: linux-safety-${{ matrix.compiler }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LLVM verifier
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm
          command -v opt
          opt --version
      - name: Linux safety probes
        timeout-minutes: 55
        run: |
          python3 scripts/safety_linux.py --compiler ${{ matrix.compiler }} --output target/safety-linux-${{ matrix.compiler }}-report.json
      - name: Upload Linux safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-linux-${{ matrix.compiler }}
          path: extracted/jabberwock-safety-ci-resume/target/safety-linux-${{ matrix.compiler }}*
          if-no-files-found: ignore

  specification-judgement:
    name: Specification judgement infrastructure (jwc and Rust)
    env:
      JW_CLANG: /usr/bin/clang
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: extracted/jabberwock-safety-ci-resume
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang
          clang --version
      - name: Install pinned Lean 4.24.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lean-4.24.0-linux.tar.zst"
          lean_root="$RUNNER_TEMP/jw-lean"
          curl --fail --location --silent --show-error --retry 3 --max-time 300 \
            -o "$archive" https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux.tar.zst
          printf '%s  %s\n' b14f5e5159219dd1a1956c3b806813319f5e94ccd5bdfd56f54520609a5bb5ec "$archive" | sha256sum -c -
          mkdir -p "$lean_root"
          tar --zstd -xf "$archive" -C "$lean_root" --strip-components=1
          echo "$lean_root/bin" >> "$GITHUB_PATH"
      - name: Run formal runner including all three judgement stages
        shell: bash
        run: |
          set +e
          python scripts/formal_tool.py --output target/formal-tool
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "Formal runner failed: $code"
            cat target/formal-tool/*.stderr.log || true
            cat target/formal-tool/summary.json || true
            exit 2
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('target/formal-tool/summary.json').read_text())
          judgement = result.get('safety_acceptance', {})
          print('Infrastructure:', result.get('infrastructure_status'))
          print('Whole compiler proof:', result.get('status'))
          print('Specification judgement:', judgement.get('status'))
          print('Per compiler:', judgement.get('summary', {}).get('by_compiler'))
          if result.get('infrastructure_status') != 'OPERATIONAL':
              raise SystemExit('Formal infrastructure failed')
          if judgement.get('verification') != 'INDEPENDENT_LOCAL_REPLAY':
              raise SystemExit('Missing independent replay')
          if judgement.get('summary', {}).get('required_goals') != 10:
              raise SystemExit('Missing compiler goals')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Infrastructure: **OPERATIONAL**\n\n')
              out.write('Whole compiler proof: **' + result['status'] + '**\n\n')
              out.write('Specification judgement: **' + judgement['status'] + '**\n\n')
              for compiler, counts in judgement['summary']['by_compiler'].items():
                  out.write(f"- {compiler}: {counts['accepted']}/{counts['required']} goals accepted\n")
          PY
      - name: Upload specification judgement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specification-judgement-evidence
          path: extracted/jabberwock-safety-ci-resume/target/formal-tool/
          if-no-files-found: warn

  elision-certificate:
    name: Elided generation checks (jwc IR, Lean checker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: extracted/jabberwock-safety-ci-resume
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extracted/jabberwock-safety-ci-resume
          key: elision-certificate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build jwc with the Rust compiler (system Clang, before Lean is on PATH)
        timeout-minutes: 20
        run: |
          clang --version
          cargo build --release --locked
          ./target/release/jabberwock build --release -o target/jwc-bin jwc/main.jw
      - name: Install pinned Lean 4.24.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lean-4.24.0-linux.tar.zst"
          lean_root="$RUNNER_TEMP/jw-lean"
          curl --fail --location --silent --show-error --retry 3 --max-time 300 \
            -o "$archive" https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux.tar.zst
          printf '%s  %s\n' b14f5e5159219dd1a1956c3b806813319f5e94ccd5bdfd56f54520609a5bb5ec "$archive" | sha256sum -c -
          mkdir -p "$lean_root"
          tar --zstd -xf "$archive" -C "$lean_root" --strip-components=1
          echo "$lean_root/bin" >> "$GITHUB_PATH"
      - name: Check the proofs and build the checker
        timeout-minutes: 20
        working-directory: extracted/jabberwock-safety-ci-resume/formal
        run: |
          lake build
          lake build elision-check
      - name: Re-check every elided generation check (VERIFIED / NOT_VERIFIED / TOOL_ERROR)
        timeout-minutes: 20
        run: |
          python3 scripts/elision_check.py --jwc target/jwc-bin
          python3 - <<'PY'
          import json, os
          d = json.load(open('target/elision-check/summary.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"Elided checks: **{d['status']}** ({d['checked']} programs checked, {d['skipped']} did not reach IR)\n")
          PY
      - name: Upload elision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elision-certificate-evidence
          path: extracted/jabberwock-safety-ci-resume/target/elision-check/summary.json
          if-no-files-found: warn
