name: Jabberwock test suite
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jabberwock-tests.yml'
      - 'extracted/jabberwock-safety-ci-resume/src/**'
      - 'extracted/jabberwock-safety-ci-resume/tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: extracted/jabberwock-safety-ci-resume
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extracted/jabberwock-safety-ci-resume
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rust compile (measured, bounded)
        timeout-minutes: 8
        run: |
          /usr/bin/time -v timeout 450s cargo test --all-targets --locked --no-run
      - name: Rust library and binaries
        if: success() || failure()
        timeout-minutes: 5
        run: |
          /usr/bin/time -v timeout 270s cargo test --lib --bins --locked -- --test-threads=4
      - name: Rust integration tests (identified individually)
        if: success() || failure()
        timeout-minutes: 18
        shell: bash
        run: |
          failures=0
          for file in tests/*.rs; do
            suite="${file##*/}"
            suite="${suite%.rs}"
            echo "::group::integration suite: ${suite}"
            start=$SECONDS
            timeout 75s cargo test --locked --test "$suite" -- --test-threads=4
            rc=$?
            echo "SUITE_RESULT suite=${suite} exit=${rc} duration=$((SECONDS-start))s"
            echo "::endgroup::"
            if [[ $rc -ne 0 ]]; then failures=$((failures+1)); fi
          done
          echo "FAILED_SUITES=$failures"
          [[ $failures -eq 0 ]]
      - name: Python regression tests
        if: success() || failure()
        timeout-minutes: 5
        run: timeout 240s python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Linux safety probes
        if: success() || failure()
        timeout-minutes: 8
        run: timeout 450s python3 scripts/safety_linux.py
      - name: Lean formal verification
        if: success() || failure()
        timeout-minutes: 5
        run: timeout 240s python3 scripts/formal_report.py --compiler all --output target/formal-report.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jabberwock-test-evidence
          path: |
            extracted/jabberwock-safety-ci-resume/target/*.json
            extracted/jabberwock-safety-ci-resume/target/**/*.json
          if-no-files-found: ignore
