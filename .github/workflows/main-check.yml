# jabberwock の mainを Linux と Windows で試す。
# main-check ブランチへの push だけで動く（main の他のワークフローには触れない）
name: main-check

on:
  push:
    branches: [main-check]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: main-check
    steps:
      - uses: actions/checkout@v4
      - name: clang の版
        run: clang --version
      - name: テスト
        run: cargo test --no-fail-fast
      - name: テスト（実行ファイルとも突き合わせる）
        if: success() || failure()
        env:
          JW_NATIVE: "1"
        run: cargo test --no-fail-fast
