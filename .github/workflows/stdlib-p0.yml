# jabberwock の claude/project-thread-1zfthy（標準ライブラリの組み込み P0）を Linux と Windows で試す。
# stdlib-p0 ブランチへの push だけで動く（main の他のワークフローには触れない）
name: stdlib-p0

on:
  push:
    branches: [stdlib-p0]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: stdlib-p0
    steps:
      - uses: actions/checkout@v4
      - name: clang の版
        run: clang --version
      - name: テスト
        run: cargo test --no-fail-fast
      - name: テスト（実行ファイルとも突き合わせる）
        env:
          JW_NATIVE: "1"
        run: cargo test --no-fail-fast
